<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HuddersHub - My Orders</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,400;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
            rel="stylesheet"
        />
        <style>
            :root {
                --orange: #ff5e3a;
                --green: #0f260b;
                --bg: #f7f6f3;
                --line: #dce3da;
                --muted: #5e6a63;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: var(--bg);
                color: #0b140a;
            }
            .wrap {
                max-width: 1180px;
                margin: 0 auto;
                padding: 0 20px;
            }
            .header {
                position: sticky;
                top: 0;
                background: #fff;
                border-bottom: 1px solid var(--line);
                z-index: 2;
            }
            .header-inner {
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: inherit;
            }
            .brand img {
                width: 42px;
                height: 42px;
            }
            .brand span {
                font-family: "Google Sans Flex", sans-serif;
                font-style: italic;
                font-size: 26px;
                font-weight: 700;
                color: var(--green);
            }
            .layout {
                display: grid;
                grid-template-columns: 260px 1fr;
                gap: 20px;
                padding: 24px 0;
            }
            .side,
            .card {
                background: #fff;
                border: 1px solid var(--line);
            }
            .side {
                padding: 18px;
                height: max-content;
            }
            .profile-chip {
                display: flex;
                gap: 10px;
                align-items: center;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--line);
                margin-bottom: 14px;
            }
            .avatar {
                width: 46px;
                height: 46px;
                border: 1px solid var(--line);
                display: grid;
                place-items: center;
                background: #f3f5f2;
            }
            .name {
                font-weight: 700;
            }
            .mail {
                font-size: 13px;
                color: var(--muted);
            }
            .menu {
                display: grid;
                gap: 8px;
            }
            .menu a {
                padding: 10px 12px;
                text-decoration: none;
                color: #1e2a1c;
                font-size: 14px;
                line-height: 1.35;
                font-weight: 600;
                border: 1px solid transparent;
            }
            .menu a:visited {
                color: #1e2a1c;
            }
            .menu a.active,
            .menu a:hover {
                border-color: var(--line);
                background: #f7faf6;
                font-weight: 600;
            }
            .menu a.logout {
                margin-top: 6px;
                border-top: 1px solid var(--line);
                padding-top: 14px;
                color: #b42318;
            }
            .card {
                padding: 20px;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .top h1 {
                font-size: 24px;
            }
            .top p {
                color: var(--muted);
                font-size: 14px;
            }
            .tabs {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .tab {
                height: 36px;
                padding: 0 12px;
                border: 1px solid var(--line);
                background: #fff;
                font-weight: 600;
                font-size: 13px;
            }
            .tab.active {
                background: #eef6eb;
                color: #0f260b;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                padding: 12px 10px;
                border-top: 1px solid var(--line);
                font-size: 14px;
                text-align: left;
            }
            th {
                font-size: 12px;
                text-transform: uppercase;
                color: #5e6a63;
                letter-spacing: 0.4px;
            }
            .badge {
                display: inline-block;
                padding: 4px 8px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
            }
            .pending {
                background: #fef3c7;
                color: #92400e;
            }
            .done {
                background: #d1fae5;
                color: #065f46;
            }
            .cancel {
                background: #fee2e2;
                color: #b91c1c;
            }
            .link {
                color: var(--orange);
                font-weight: 700;
                text-decoration: none;
            }
            @media (max-width: 980px) {
                .layout {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 760px) {
                .header-inner {
                    height: 64px;
                }
                .brand span {
                    font-size: 22px;
                }
                table,
                thead,
                tbody,
                th,
                td,
                tr {
                    display: block;
                }
                thead {
                    display: none;
                }
                tr {
                    border: 1px solid var(--line);
                    margin-bottom: 10px;
                    background: #fff;
                }
                td {
                    border-top: none;
                    border-bottom: 1px solid #edf1ec;
                    padding: 10px 12px;
                }
                td:last-child {
                    border-bottom: none;
                }
                td::before {
                    content: attr(data-label);
                    display: block;
                    font-size: 11px;
                    color: #5e6a63;
                    text-transform: uppercase;
                    font-weight: 700;
                    margin-bottom: 4px;
                }
            }
        </style>
    </head>
    <body>
        <header class="header">
            <div class="wrap header-inner">
                <a class="brand" href="../public/index.html">
                    <img
                        src="../public/assets/logo.png"
                        alt="HuddersHub logo"
                    />
                    <span>HuddersHub</span>
                </a>
                <a
                    href="profile.html"
                    style="
                        text-decoration: none;
                        color: #0f260b;
                        font-weight: 600;
                    "
                    >Account</a
                >
            </div>
        </header>

        <main class="wrap layout">
            <aside class="side">
                <div class="profile-chip">
                    <div class="avatar">
                        <span class="material-icons-outlined">person</span>
                    </div>
                    <div>
                        <p class="name">Loading...</p>
                        <p class="mail">...</p>
                    </div>
                </div>
                <nav class="menu">
                    <a href="profile.html">Profile</a>
                    <a class="active" href="orders.html">My Orders</a>
                    <a href="addresses.html">Saved Addresses</a>
                    <a href="wishlist.html">Wishlist</a>
                    <a href="change-password.html">Change Password</a>
                    <a href="email-settings.html">Email Settings</a>
                    <a class="logout" href="../public/logout.html">Logout</a>
                </nav>
            </aside>

            <section class="card">
                <div class="top">
                    <div>
                        <h1>My Orders</h1>
                        <p>Track recent and past orders from local traders.</p>
                    </div>
                </div>
                <div class="tabs">
                    <button class="tab active" type="button">All</button>
                    <button class="tab" type="button">Pending</button>
                    <button class="tab" type="button">Completed</button>
                    <button class="tab" type="button">Cancelled</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Slot</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr>
                            <td
                                colspan="6"
                                style="
                                    text-align: center;
                                    padding: 20px;
                                    color: #5e6a63;
                                "
                            >
                                Loading orders...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
        <script>
            // Role check - only customers allowed
            (function () {
                const role = sessionStorage.getItem("userRole");
                if (!role) {
                    window.location.href = "../public/login.html";
                    return;
                }
                if (role.toLowerCase() !== "customer") {
                    window.location.href = "../trader/dashboard.html";
                    return;
                }
            })();

            let allOrders = [];
            let currentFilter = "all";

            function fillIdentityFromLocalCache() {
                const fullName = (
                    sessionStorage.getItem("userName") || ""
                ).trim();
                const email = (
                    sessionStorage.getItem("userEmail") || ""
                ).trim();
                if (fullName)
                    document.querySelector(".name").textContent = fullName;
                if (email) document.querySelector(".mail").textContent = email;
            }

            async function loadProfileIdentity() {
                fillIdentityFromLocalCache();

                const userId = sessionStorage.getItem("user_id");
                if (!userId) {
                    window.location.href = "../public/login.html";
                    return;
                }

                try {
                    const res = await fetch(
                        "../api/customer/get-profile.php?user_id=" + userId,
                    );
                    const data = await res.json();
                    if (data.success && data.data) {
                        const user = data.data;
                        const firstName =
                            user.FIRSTNAME || user.firstname || "";
                        const lastName = user.LASTNAME || user.lastname || "";
                        const email = user.EMAIL || user.email || "-";
                        document.querySelector(".name").textContent =
                            (firstName + " " + lastName).trim() || "Customer";
                        document.querySelector(".mail").textContent = email;
                    }
                } catch (err) {
                    console.error("Error loading profile identity:", err);
                    fillIdentityFromLocalCache();
                }
            }

            async function loadOrders() {
                try {
                    const res = await fetch("../api/orders/get-orders.php");
                    const data = await res.json();
                    if (data.success) {
                        allOrders = data.data;
                        renderOrders();
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById("orders-tbody").innerHTML =
                        '<tr><td colspan="6" style="text-align:center;padding:20px;color:red;">Error loading orders</td></tr>';
                }
            }

            function renderOrders() {
                const filtered =
                    currentFilter === "all"
                        ? allOrders
                        : allOrders.filter(
                              (o) => o.STATUS.toLowerCase() === currentFilter,
                          );

                if (filtered.length === 0) {
                    document.getElementById("orders-tbody").innerHTML =
                        '<tr><td colspan="6" style="text-align:center;padding:20px;color:#5E6A63;">No orders found</td></tr>';
                    return;
                }

                let html = "";
                filtered.forEach((order) => {
                    const date = new Date(order.ORDER_DATE).toLocaleDateString(
                        "en-GB",
                        { day: "numeric", month: "short", year: "numeric" },
                    );
                    const slot = order.SLOT_DATE
                        ? new Date(order.SLOT_DATE).toLocaleDateString(
                              "en-GB",
                              { weekday: "short" },
                          ) +
                          " " +
                          (order.SLOT_TIME || "")
                        : "N/A";
                    const statusClass =
                        order.STATUS === "Pending"
                            ? "pending"
                            : order.STATUS === "Completed" ||
                                order.STATUS === "Delivered"
                              ? "done"
                              : "cancel";
                    const statusText =
                        order.STATUS === "Completed"
                            ? "Ready for Collection"
                            : order.STATUS;

                    html += "<tr>";
                    html +=
                        '<td data-label="Order ID">#HDR-' +
                        order.ORDER_ID +
                        "</td>";
                    html += '<td data-label="Date">' + date + "</td>";
                    html += '<td data-label="Slot">' + slot + "</td>";
                    html +=
                        '<td data-label="Total">GBP ' +
                        parseFloat(order.AMOUNT || 0).toFixed(2) +
                        "</td>";
                    html +=
                        '<td data-label="Status"><span class="badge ' +
                        statusClass +
                        '">' +
                        statusText +
                        "</span></td>";
                    const cancelBtn =
                        order.STATUS === "Pending"
                            ? `<button onclick="cancelOrderFromList(${order.ORDER_ID})" style="padding:6px 12px;background:#FEE2E2;color:#991B1B;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-left:8px;">Cancel</button>`
                            : "";
                    html +=
                        '<td data-label="Action"><a class="link" href="order-detail.html?order_id=' +
                        order.ORDER_ID +
                        '">View Details</a>' +
                        cancelBtn +
                        "</td>";
                    html += "</tr>";
                });
                document.getElementById("orders-tbody").innerHTML = html;
            }

            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", function () {
                    document
                        .querySelectorAll(".tab")
                        .forEach((t) => t.classList.remove("active"));
                    this.classList.add("active");
                    currentFilter = this.textContent.toLowerCase();
                    renderOrders();
                });
            });

            async function cancelOrderFromList(orderId) {
                if (
                    !confirm(
                        "Cancel order #" + orderId + "? This cannot be undone.",
                    )
                )
                    return;
                try {
                    const res = await fetch("../api/orders/cancel-order.php", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ order_id: orderId }),
                    });
                    const data = JSON.parse(await res.text());
                    if (data.success) {
                        alert("Order #" + orderId + " has been cancelled.");
                        loadOrders();
                    } else {
                        alert(data.error || "Could not cancel order.");
                    }
                } catch (e) {
                    alert("Network error.");
                }
            }

            loadProfileIdentity();
            loadOrders();
        </script>
    </body>
</html>
