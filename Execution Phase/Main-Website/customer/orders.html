<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HuddersHub - My Orders</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,400;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
            rel="stylesheet"
        />
        <style>
            :root {
                --orange: #ff5e3a;
                --green: #0f260b;
                --bg: #f7f6f3;
                --line: #dce3da;
                --muted: #5e6a63;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            /* Professional Modal */
            .prof-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10000;opacity:0;transition:opacity 0.25s ease}
            .prof-modal-overlay.show{display:flex;opacity:1}
            .prof-modal{background:#fff;border-radius:12px;padding:28px 32px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2);transform:scale(0.9);transition:transform 0.25s ease}
            .prof-modal-overlay.show .prof-modal{transform:scale(1)}
            .prof-modal-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px}
            .prof-modal-icon.success{background:#e8f5e9;color:#2e7d32}
            .prof-modal-icon.error{background:#ffebee;color:#c62828}
            .prof-modal-icon.warning{background:#fff3e0;color:#ef6c00}
            .prof-modal-icon.info{background:#e3f2fd;color:#1565c0}
            .prof-modal-icon.confirm{background:#f3e5f5;color:#7b1fa2}
            .prof-modal-title{font-size:20px;font-weight:600;margin-bottom:12px;color:#1a1a1a}
            .prof-modal-message{font-size:15px;color:#555;line-height:1.5;margin-bottom:24px}
            .prof-modal-buttons{display:flex;gap:12px;justify-content:center}
            .prof-modal-btn{padding:12px 28px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s ease}
            .prof-modal-btn.primary{background:#0f260b;color:#fff}
            .prof-modal-btn.primary:hover{background:#1c3c17}
            .prof-modal-btn.secondary{background:#f0f0f0;color:#333}
            .prof-modal-btn.secondary:hover{background:#e0e0e0}
            .prof-modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#999;line-height:1}
            .prof-modal-close:hover{color:#333}
            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: var(--bg);
                color: #0b140a;
            }
            .wrap {
                max-width: 1180px;
                margin: 0 auto;
                padding: 0 20px;
            }
            .header {
                position: sticky;
                top: 0;
                background: #fff;
                border-bottom: 1px solid var(--line);
                z-index: 2;
            }
            .header-inner {
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: inherit;
            }
            .brand img {
                width: 42px;
                height: 42px;
            }
            .brand span {
                font-family: "Google Sans Flex", sans-serif;
                font-style: italic;
                font-size: 26px;
                font-weight: 700;
                color: var(--green);
            }
            .layout {
                display: grid;
                grid-template-columns: 260px 1fr;
                gap: 20px;
                padding: 24px 0;
            }
            .side,
            .card {
                background: #fff;
                border: 1px solid var(--line);
            }
            .side {
                padding: 18px;
                height: max-content;
            }
            .profile-chip {
                display: flex;
                gap: 10px;
                align-items: center;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--line);
                margin-bottom: 14px;
            }
            .avatar {
                width: 46px;
                height: 46px;
                border: 1px solid var(--line);
                display: grid;
                place-items: center;
                background: #f3f5f2;
            }
            .name {
                font-weight: 700;
            }
            .mail {
                font-size: 13px;
                color: var(--muted);
            }
            .menu {
                display: grid;
                gap: 8px;
            }
            .menu a {
                padding: 10px 12px;
                text-decoration: none;
                color: #1e2a1c;
                font-size: 14px;
                line-height: 1.35;
                font-weight: 600;
                border: 1px solid transparent;
            }
            .menu a:visited {
                color: #1e2a1c;
            }
            .menu a.active,
            .menu a:hover {
                border-color: var(--line);
                background: #f7faf6;
                font-weight: 600;
            }
            .menu a.logout {
                margin-top: 6px;
                border-top: 1px solid var(--line);
                padding-top: 14px;
                color: #b42318;
            }
            .card {
                padding: 20px;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .top h1 {
                font-size: 24px;
            }
            .top p {
                color: var(--muted);
                font-size: 14px;
            }
            .tabs {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .tab {
                height: 36px;
                padding: 0 12px;
                border: 1px solid var(--line);
                background: #fff;
                font-weight: 600;
                font-size: 13px;
            }
            .tab.active {
                background: #eef6eb;
                color: #0f260b;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                padding: 12px 10px;
                border-top: 1px solid var(--line);
                font-size: 14px;
                text-align: left;
            }
            th {
                font-size: 12px;
                text-transform: uppercase;
                color: #5e6a63;
                letter-spacing: 0.4px;
            }
            .badge {
                display: inline-block;
                padding: 4px 8px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
            }
            .pending {
                background: #fef3c7;
                color: #92400e;
            }
            .done {
                background: #d1fae5;
                color: #065f46;
            }
            .collected {
                background: #065f46;
                color: #ffffff;
                border-radius: 4px;
            }
            .cancel {
                background: #fee2e2;
                color: #b91c1c;
            }
            .link {
                color: var(--orange);
                font-weight: 700;
                text-decoration: none;
            }
            @media (max-width: 980px) {
                .layout {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 760px) {
                .header-inner {
                    height: 64px;
                }
                .brand span {
                    font-size: 22px;
                }
                table,
                thead,
                tbody,
                th,
                td,
                tr {
                    display: block;
                }
                thead {
                    display: none;
                }
                tr {
                    border: 1px solid var(--line);
                    margin-bottom: 10px;
                    background: #fff;
                }
                td {
                    border-top: none;
                    border-bottom: 1px solid #edf1ec;
                    padding: 10px 12px;
                }
                td:last-child {
                    border-bottom: none;
                }
                td::before {
                    content: attr(data-label);
                    display: block;
                    font-size: 11px;
                    color: #5e6a63;
                    text-transform: uppercase;
                    font-weight: 700;
                    margin-bottom: 4px;
                }
            }
        </style>
    </head>
    <body>
        <header class="header">
            <div class="wrap header-inner">
                <a class="brand" href="../public/index.html">
                    <img
                        src="../public/assets/logo.png"
                        alt="HuddersHub logo"
                    />
                    <span>HuddersHub</span>
                </a>
                <a
                    href="profile.html"
                    style="
                        text-decoration: none;
                        color: #0f260b;
                        font-weight: 600;
                    "
                    >Account</a
                >
                <a href="../public/cart.html" style="text-decoration:none;color:#0f260b;font-weight:600;position:relative;display:inline-flex;align-items:center;">
                    <span class="material-icons-outlined" style="font-size:22px;">shopping_cart</span>
                    <span id="cartCount" style="position:absolute;top:-6px;right:-8px;background:#0f260b;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:999px;">0</span>
                </a>
            </div>
        </header>

        <main class="wrap layout">
            <aside class="side">
                <div class="profile-chip">
                    <div class="avatar">
                        <span class="material-icons-outlined">person</span>
                    </div>
                    <div>
                        <p class="name">Loading...</p>
                        <p class="mail">...</p>
                    </div>
                </div>
                <nav class="menu">
                    <a href="profile.html">Profile</a>
                    <a class="active" href="orders.html">My Orders</a>
                    <a href="addresses.html">Saved Addresses</a>
                    <a href="wishlist.html">Wishlist</a>
                    <a href="change-password.html">Change Password</a>
                    <a href="email-settings.html">Email Settings</a>
                    <a class="logout" href="../public/logout.html">Logout</a>
                </nav>
            </aside>

            <section class="card">
                <div class="top">
                    <div>
                        <h1>My Orders</h1>
                        <p>Track recent and past orders from local traders.</p>
                    </div>
                </div>
                <div class="tabs">
                    <button class="tab active" type="button">All</button>
                    <button class="tab" type="button">Pending</button>
                    <button class="tab" type="button">Completed</button>
                    <button class="tab" type="button">Cancelled</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Slot</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr>
                            <td
                                colspan="6"
                                style="
                                    text-align: center;
                                    padding: 20px;
                                    color: #5e6a63;
                                "
                            >
                                Loading orders...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
        <script>
            // Role check - only customers allowed
            (function () {
                const role = sessionStorage.getItem("userRole");
                if (!role) {
                    window.location.href = "../public/login.html";
                    return;
                }
                if (role.toLowerCase() !== "customer") {
                    window.location.href = "../trader/dashboard.html";
                    return;
                }
            })();

            let allOrders = [];
            let currentFilter = "all";

            function fillIdentityFromLocalCache() {
                const fullName = (
                    sessionStorage.getItem("userName") || ""
                ).trim();
                const email = (
                    sessionStorage.getItem("userEmail") || ""
                ).trim();
                if (fullName)
                    document.querySelector(".name").textContent = fullName;
                if (email) document.querySelector(".mail").textContent = email;
            }

            async function loadProfileIdentity() {
                fillIdentityFromLocalCache();

                const userId = sessionStorage.getItem("user_id");
                if (!userId) {
                    window.location.href = "../public/login.html";
                    return;
                }

                try {
                    const res = await fetch(
                        "../api/customer/get-profile.php?user_id=" + userId,
                    );
                    const data = await res.json();
                    if (data.success && data.data) {
                        const user = data.data;
                        const firstName =
                            user.FIRSTNAME || user.firstname || "";
                        const lastName = user.LASTNAME || user.lastname || "";
                        const email = user.EMAIL || user.email || "-";
                        document.querySelector(".name").textContent =
                            (firstName + " " + lastName).trim() || "Customer";
                        document.querySelector(".mail").textContent = email;
                    }
                } catch (err) {
                    console.error("Error loading profile identity:", err);
                    fillIdentityFromLocalCache();
                }
            }

            async function loadOrders() {
                try {
                    const res = await fetch("../api/orders/get-orders.php");
                    const data = await res.json();
                    if (data.success) {
                        allOrders = data.data;
                        renderOrders();
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById("orders-tbody").innerHTML =
                        '<tr><td colspan="6" style="text-align:center;padding:20px;color:red;">Error loading orders</td></tr>';
                }
            }

            function renderOrders() {
                const filtered =
                    currentFilter === "all"
                        ? allOrders
                        : allOrders.filter(
                              (o) => o.STATUS.toLowerCase() === currentFilter,
                          );

                if (filtered.length === 0) {
                    document.getElementById("orders-tbody").innerHTML =
                        '<tr><td colspan="6" style="text-align:center;padding:20px;color:#5E6A63;">No orders found</td></tr>';
                    return;
                }

                let html = "";
                filtered.forEach((order) => {
                    const date = new Date(order.ORDER_DATE).toLocaleDateString(
                        "en-GB",
                        { day: "numeric", month: "short", year: "numeric" },
                    );
                    const slot = order.SLOT_DATE
                        ? new Date(order.SLOT_DATE).toLocaleDateString(
                              "en-GB",
                              { weekday: "short" },
                          ) +
                          " " +
                          (order.SLOT_TIME || "")
                        : "N/A";
                    const statusClass =
                        order.STATUS === "Pending"
                            ? "pending"
                            : order.STATUS === "Collected"
                              ? "collected"
                              : order.STATUS === "Completed" ||
                                order.STATUS === "Delivered"
                              ? "done"
                              : "cancel";
                    const statusText =
                        order.STATUS === "Completed"
                            ? "Ready for Collection"
                            : order.STATUS;

                    html += "<tr>";
                    html +=
                        '<td data-label="Order ID">#HDR-' +
                        order.ORDER_ID +
                        "</td>";
                    html += '<td data-label="Date">' + date + "</td>";
                    html += '<td data-label="Slot">' + slot + "</td>";
                    html +=
                        '<td data-label="Total">GBP ' +
                        parseFloat(order.AMOUNT || 0).toFixed(2) +
                        "</td>";
                    html +=
                        '<td data-label="Status"><span class="badge ' +
                        statusClass +
                        '">' +
                        statusText +
                        "</span></td>";
                    const cancelBtn =
                        order.STATUS === "Pending"
                            ? `<button onclick="cancelOrderFromList(${order.ORDER_ID})" style="padding:6px 12px;background:#FEE2E2;color:#991B1B;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-left:8px;">Cancel</button>`
                            : "";
                    const reorderBtn = (order.STATUS === "Completed" || order.STATUS === "Ready" || order.STATUS === "Delivered" || order.STATUS === "Collected")
                            ? `<button onclick="reorderFromList(${order.ORDER_ID})" style="padding:6px 12px;background:#DEF7EC;color:#03543F;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-left:8px;">Reorder</button>`
                            : "";
                    const reviewBtn = order.STATUS === "Collected"
                            ? `<a href="../public/product.html" style="padding:6px 12px;background:#0f260b;color:#ffffff;text-decoration:none;border-radius:6px;font-size:12px;font-weight:600;display:inline-block;margin-left:8px;">Add Review</a>`
                            : "";
                    html +=
                        '<td data-label="Action"><a class="link" href="order-detail.html?order_id=' +
                        order.ORDER_ID +
                        '">View Details</a>' +
                        cancelBtn +
                        reorderBtn +
                        reviewBtn +
                        "</td>";
                    html += "</tr>";
                });
                document.getElementById("orders-tbody").innerHTML = html;
            }

            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", function () {
                    document
                        .querySelectorAll(".tab")
                        .forEach((t) => t.classList.remove("active"));
                    this.classList.add("active");
                    currentFilter = this.textContent.toLowerCase();
                    renderOrders();
                });
            });

            async function cancelOrderFromList(orderId) {
                showConfirm("Are you sure you want to cancel order #" + orderId + "? A full refund will be issued and you will receive a confirmation email.", function(confirmed){
                    if(!confirmed) return;
                    (async () => {
                        try {
                            const res = await fetch("../api/orders/cancel-order.php", {
                                method: "POST",
                                credentials: "same-origin",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ order_id: orderId }),
                            });
                            const text = await res.text();
                            let data;
                            try {
                                data = JSON.parse(text);
                            } catch (parseErr) {
                                showModal("Server returned an invalid response. Please try again.", "error");
                                console.error("Parse error:", text);
                                return;
                            }
                            if (data.success) {
                                showModal("Order #" + orderId + " has been cancelled. A confirmation email has been sent to your inbox.", "success");
                                loadOrders();
                            } else {
                                showModal(data.error || "Could not cancel order.", "error");
                            }
                        } catch (e) {
                            showModal("Network error: " + e.message, "error");
                            console.error("Fetch error:", e);
                        }
                    })();
                }, "Cancel Order");
            }

            async function reorderFromList(orderId) {
                try {
                    const res = await fetch("../api/orders/reorder.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ order_id: orderId })
                    });
                    const text = await res.text();
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (parseErr) {
                        showModal("Server returned an invalid response.", "error");
                        console.error("Parse error:", text);
                        return;
                    }
                    if (data.success) {
                        const cartCountEl = document.getElementById('cartCount');
                        if (cartCountEl && data.cart_count !== undefined) {
                            cartCountEl.textContent = data.cart_count;
                        }
                        showModal(data.count + " item(s) have been added to your cart.", "success", "Reorder Successful", [
                            { label: "View Cart", primary: true, action: () => window.location.href = "../public/cart.html" },
                            { label: "Continue Shopping", action: () => { closeProfModal(); } }
                        ]);
                    } else {
                        showModal(data.error || "Could not reorder.", "error");
                    }
                } catch (e) {
                    showModal("Network error: " + e.message, "error");
                    console.error("Fetch error:", e);
                }
            }

            loadProfileIdentity();
            loadOrders();
            loadCartCount();

            async function loadCartCount() {
                try {
                    const userId = sessionStorage.getItem('user_id');
                    if (!userId) return;
                    const res = await fetch('../api/customer/get-cart-count.php?user_id=' + userId, { credentials: 'same-origin' });
                    const data = await res.json();
                    if (data.success && data.count !== undefined) {
                        const el = document.getElementById('cartCount');
                        if (el) el.textContent = data.count;
                    }
                } catch (err) {
                    console.error('Error loading cart count:', err);
                }
            }
        </script>
        <!-- Professional Modal -->
        <div class="prof-modal-overlay" id="profModal">
            <div class="prof-modal" style="position:relative;">
                <button class="prof-modal-close" onclick="closeProfModal()">&times;</button>
                <div class="prof-modal-icon" id="profModalIcon"></div>
                <div class="prof-modal-title" id="profModalTitle"></div>
                <div class="prof-modal-message" id="profModalMessage"></div>
                <div class="prof-modal-buttons" id="profModalButtons"></div>
            </div>
        </div>
        <script>
        function showModal(msg, type = "info", title = "", buttons = []) {
            const overlay = document.getElementById("profModal");
            const icon = document.getElementById("profModalIcon");
            const titleEl = document.getElementById("profModalTitle");
            const msgEl = document.getElementById("profModalMessage");
            const btns = document.getElementById("profModalButtons");
            const icons = { success: "check_circle", error: "error", warning: "warning", info: "info", confirm: "help" };
            const titles = { success: "Success", error: "Error", warning: "Warning", info: "Notice", confirm: "Confirm" };
            icon.className = "prof-modal-icon " + type;
            icon.innerHTML = '<span class="material-icons-outlined" style="font-size:32px;">' + (icons[type] || "info") + '</span>';
            titleEl.textContent = title || titles[type] || "";
            msgEl.textContent = msg;

            if (buttons.length > 0) {
                btns.innerHTML = buttons.map((btn, i) => {
                    const cls = btn.primary ? 'prof-modal-btn primary' : 'prof-modal-btn secondary';
                    return '<button class="' + cls + '" data-idx="' + i + '">' + btn.label + '</button>';
                }).join('');
                btns.querySelectorAll('button').forEach((el, i) => {
                    el.addEventListener('click', () => {
                        if (buttons[i].action) buttons[i].action();
                    });
                });
            } else {
                btns.innerHTML = '<button class="prof-modal-btn primary" onclick="closeProfModal()">OK</button>';
            }
            overlay.classList.add("show");
            document.body.style.overflow = "hidden";
        }
        function showConfirm(msg, onConfirm, title = "Confirm") {
            const overlay = document.getElementById("profModal");
            const icon = document.getElementById("profModalIcon");
            const titleEl = document.getElementById("profModalTitle");
            const msgEl = document.getElementById("profModalMessage");
            const btns = document.getElementById("profModalButtons");
            icon.className = "prof-modal-icon confirm";
            icon.innerHTML = '<span class="material-icons-outlined" style="font-size:32px;">help</span>';
            titleEl.textContent = title;
            msgEl.textContent = msg;
            btns.innerHTML = '<button class="prof-modal-btn secondary" onclick="closeProfModal(false)">Cancel</button><button class="prof-modal-btn primary" onclick="closeProfModal(true)">Confirm</button>';
            overlay.classList.add("show");
            document.body.style.overflow = "hidden";
            window._profConfirmCallback = onConfirm;
        }
        function closeProfModal(confirmed = false) {
            document.getElementById("profModal").classList.remove("show");
            document.body.style.overflow = "";
            if (window._profConfirmCallback) { window._profConfirmCallback(confirmed); window._profConfirmCallback = null; }
        }
        </script>
    </body>
</html>
