<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuddersHub - Fresh Spinach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
:root {
    --primary-orange: #FF5E3A;
    --primary-orange-light: #FF8C70;
    --primary-orange-dark: #E3472C;
    --primary-green: #0F260B;
    --primary-green-light: rgba(15, 38, 11, 0.14);
    --primary-green-dark: #0B1C08;
    --brand-dark: #0F260B;
    --brand-mid: #1C3C17;
    --accent-green: #CAED95;
    --bg-white: #FFFFFF;
    --bg-light: #F7F6F3;
    --bg-gray: #F2F4F1;
    --surface: #FFFFFF;
    --surface-alt: #F7F6F3;
    --text-primary: #0B140A;
    --text-muted: #5E6A63;
    --text-dark-gray: #1E2A1C;
    --text-medium-gray: #5E6A63;
    --border-light: #DCE3DA;
    --border: #DCE3DA;
    --bg-gradient: linear-gradient(135deg, #F8FAF7 0%, #FFFFFF 100%);
    --badge-bg: #0F260B;
    --badge-text: #ffffff;
    --shadow-sm: 0 10px 22px rgba(15, 38, 11, 0.12);
    --shadow-md: 0 16px 32px rgba(15, 38, 11, 0.16);
    --shadow-lg: 0 18px 36px rgba(15, 38, 11, 0.16);
    --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --radius-sm: 0;
    --secondary-color: #0F260B;
    --secondary-color-soft: rgba(15,38,11,.14);
    --accent-sale: #FF5E3A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Google Sans Flex', sans-serif;
    background: linear-gradient(180deg, #F7F6F3 0%, #FFFFFF 45%, #F7F6F3 100%);
    color: var(--text-primary);
    padding-top: 140px;
    min-height: 100vh;
}
a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
button { font-family: inherit; transition: all 0.3s ease; cursor: pointer; }
img { max-width: 100%; height: auto; display: block; }
.material-icons-outlined { font-size: 18px; vertical-align: middle; }
.page-wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* HEADER */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--bg-gradient); backdrop-filter: blur(12px); transition: var(--transition-smooth); }
header.scrolled { box-shadow: var(--shadow-md); background: var(--bg-white); }
.top-bar { background: rgba(255,255,255,0.98); border-bottom: 1px solid var(--border-light); padding: 14px 0; transition: var(--transition-smooth); }
header.scrolled .top-bar { padding: 10px 0; }
header.scrolled .brand img { width: 42px; height: 42px; }
header.scrolled .brand-text { font-size: 30px; }
.top-bar-inner { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 56px; height: 56px; object-fit: contain; transition: var(--transition-smooth); filter: drop-shadow(0 6px 12px rgba(15,38,11,0.12)); }
.brand-text { font-family: 'Google Sans Flex', sans-serif; font-weight: 700; font-style: italic; font-size: 36px; color: var(--brand-dark); }
.search-wrap { display: flex; align-items: center; gap: 12px; }
.search-bar { position: relative; flex: 1; min-width: 280px; }
.search-bar input { width: 100%; padding: 6px 44px 6px 14px; height: 36px; border: 1px solid #C8D1C6; background: #fff; font-size: 14px; outline: none; border-radius: 0; }
.search-bar input:focus { border-color: var(--primary-orange); box-shadow: 0 0 0 3px rgba(255,94,58,.22); }
.search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #1B2419; opacity: .55; }
.actions { display: flex; align-items: center; gap: 16px; }
.user-menu, .action-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: var(--radius-sm); }
.user-menu { color: var(--text-primary); }
.user-menu:hover, .action-btn:hover { background: var(--primary-green-light); color: var(--brand-dark); }
.action-btn { color: var(--text-medium-gray); }
.icon-with-badge { position: relative; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 6px; color: var(--text-primary); border-radius: 0; }
.icon-with-badge:hover { background: var(--primary-green-light); color: var(--brand-dark); }
.icon-with-badge .material-icons-outlined { font-size: 24px; }
.badge { position: absolute; top: 0; right: 0; background: var(--badge-bg); color: #fff; padding: 2px 5px; font-size: 10px; font-weight: 600; min-width: 16px; text-align: center; }
.nav-bar { background: #F1F3F0; border-bottom: 1px solid var(--border-light); padding: 10px 0; transition: var(--transition-smooth); }
header.scrolled .nav-bar { padding: 8px 0; background: #F3F4F6; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-medium-gray); flex-wrap: wrap; }
.breadcrumb a { color: var(--text-dark-gray); }
.breadcrumb a:hover { color: var(--brand-dark); }
.breadcrumb-sep { color: #9AA19A; }
.breadcrumb-current { color: var(--brand-dark); font-weight: 600; }

/* CART DRAWER */
.cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; visibility: hidden; transition: var(--transition-smooth); z-index: 1200; }
.cart-overlay.open { opacity: 1; visibility: visible; }
.cart-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 92vw); background: #fff; box-shadow: -16px 0 40px rgba(15,38,11,.18); transform: translateX(100%); transition: var(--transition-smooth); z-index: 1300; display: flex; flex-direction: column; }
.cart-drawer.open { transform: translateX(0); }
.cart-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
.cart-header h3 { font-size: 20px; font-weight: 700; color: var(--text-dark-gray); }
.cart-close { border: none; background: transparent; font-size: 20px; color: var(--text-dark-gray); }
.cart-body { padding: 18px 22px; flex: 1; display: grid; gap: 14px; align-content: start; overflow-y: auto; }
.cart-item { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: flex-start; border: 1px solid var(--border-light); padding: 12px; background: #fff; box-shadow: var(--shadow-sm); }
.cart-item img { width: 56px; height: 56px; object-fit: cover; background: var(--bg-gray); }
.cart-item-details { display: grid; gap: 10px; }
.cart-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cart-item h4 { font-size: 14px; margin-bottom: 4px; color: var(--text-dark-gray); }
.cart-item p { font-size: 12px; color: var(--text-medium-gray); }
.cart-price { font-weight: 700; color: var(--primary-orange); font-size: 14px; white-space: nowrap; }
.cart-item-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cart-qty { display: inline-flex; align-items: center; gap: 10px; background: var(--bg-gray); padding: 6px 10px; }
.cart-qty button { border: none; background: #fff; width: 22px; height: 22px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text-dark-gray); box-shadow: var(--shadow-sm); }
.cart-qty .qty-val { font-size: 12px; font-weight: 700; min-width: 12px; text-align: center; }
.cart-remove { border: none; background: transparent; color: var(--text-medium-gray); font-size: 12px; cursor: pointer; text-decoration: underline; }
.cart-footer { border-top: 1px solid var(--border-light); padding: 16px 22px 20px; display: grid; gap: 12px; }
.cart-total { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--text-dark-gray); }
.cart-actions { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.cart-link { font-size: 13px; color: var(--text-medium-gray); text-decoration: none; border-bottom: 1px solid var(--border-light); }
.cart-link:hover { color: var(--brand-dark); border-bottom-color: var(--brand-dark); }
.cart-checkout { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: none; background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-light) 100%); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 22px rgba(255,94,58,.28); }
.cart-empty { display: none; text-align: center; color: var(--text-medium-gray); padding: 24px 0; font-size: 13px; }

/* PRODUCT PAGE */
.product-hero { padding: 16px 0 32px; }
.hero-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-md); padding: 24px; }
.hero-left { display: flex; flex-direction: column; }
.image-card { background: transparent; }
.slider-wrap { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; cursor: zoom-in; }
.main-image-wrap { width: 100%; height: 100%; overflow: hidden; position: relative; }
.main-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.slider-wrap:hover .main-image-wrap img { transform: scale(1.15); }
.slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.95); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: all 0.2s ease; border-radius: 0; box-shadow: var(--shadow-sm); }
.slider-arrow:hover { background: #fff; box-shadow: var(--shadow-md); }
.slider-arrow .material-icons-outlined { font-size: 20px; color: var(--brand-dark); }
.slider-prev { left: 8px; }
.slider-next { right: 8px; }
.thumb-strip { display: flex; gap: 6px; margin-top: 10px; }
.thumb { width: 60px; height: 60px; border: 2px solid transparent; overflow: hidden; cursor: pointer; background: transparent; padding: 0; transition: all 0.2s ease; opacity: 0.6; }
.thumb:hover { opacity: 0.85; border-color: rgba(15,38,11,0.4); }
.thumb.active { border-color: var(--brand-dark); opacity: 1; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-right { display: flex; flex-direction: column; gap: 8px; }
.info-card { background: transparent; padding: 0; }
.top-meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.product-id { font-size: 14px; color: var(--text-muted); font-weight: 400; }
.stock-share-fav { display: flex; align-items: center; gap: 8px; }
.stock-badge { background: var(--brand-dark); color: var(--accent-green); padding: 4px 12px; font-size: 12px; font-weight: 600; border: 1px solid rgba(15,38,11,0.45); }
.icon-btn { border: none; background: transparent; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border-radius: 0; }
.icon-btn:hover { background: var(--primary-green-light); }
.icon-btn .material-icons-outlined { font-size: 20px; color: var(--text-muted); transition: color 0.2s; }
.icon-btn.fav-active .material-icons-outlined { color: var(--primary-orange); }
.product-title { font-size: clamp(32px, 5vw, 52px); font-weight: 700; color: var(--text-primary); line-height: 1.1; margin-bottom: 6px; }
.rating-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.stars-inline { display: inline-flex; gap: 2px; color: #F4B740; }
.stars-inline .material-icons-outlined { font-size: 20px; }
.rating-text { font-size: 14px; color: var(--text-muted); font-weight: 400; }
.category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.cat-label { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.tag { background: #F2F4F1; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
.tag:hover { background: var(--brand-dark); color: #fff; }
.sold-by { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
.sold-by strong { color: var(--text-primary); font-weight: 600; font-size: 15px; }
.size-row { display: flex; gap: 8px; margin-bottom: 6px; }
.size-chip { border: 2px solid #DCE3DA; background: #FFFFFF; padding: 8px 18px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; user-select: none; border-radius: 0; }
.size-chip:hover { border-color: var(--brand-dark); background: #F2F4F1; }
.size-chip.active { background: var(--brand-dark); color: #fff; border-color: var(--brand-dark); box-shadow: 0 2px 8px rgba(15,38,11,0.15); }
.qty-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.qty-row label { font-weight: 500; font-size: 14px; color: var(--text-muted); }
.qty-control { display: inline-flex; align-items: center; gap: 8px; background: #F2F4F1; padding: 4px 10px; border: 1px solid var(--border); }
.qty-btn-sm { border: none; background: #fff; width: 28px; height: 28px; cursor: pointer; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; border-radius: 0; transition: background 0.2s; }
.qty-btn-sm:hover { background: var(--primary-green-light); }
.qty-val { min-width: 28px; text-align: center; font-weight: 500; font-size: 14px; color: var(--text-primary); }
.qty-hint { font-size: 11px; color: var(--text-muted); }
.price-block { margin: 12px 0 16px; }
.price { font-size: 48px; font-weight: 800; color: var(--brand-dark); display: flex; align-items: center; gap: 6px; }
.price .pound-sign { font-size: 36px; font-weight: 700; vertical-align: super; }

/* ✅ NEW SLOT SELECTION STYLES */
.slot-selection-wrap { margin: 10px 0; }
.slot-selection-wrap label { display: block; font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.slot-dropdown { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 0; font-size: 14px; font-family: inherit; outline: none; background-color: #fff; cursor: pointer; }
.slot-dropdown:focus { border-color: var(--brand-dark); }

.btn-row { display: flex; gap: 12px; margin-top: 16px; }
.btn { padding: 16px 40px; border: none; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s; border-radius: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
.btn-add-cart { background: var(--brand-dark); color: #fff; flex: 1; }
.btn-add-cart:hover { background: var(--brand-mid); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.btn-buy-now { background: var(--primary-orange); color: #fff; flex: 1; }
.btn-buy-now:hover { background: var(--primary-orange-dark); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(255,94,58,0.3); }
.btn-buy-now:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.delivery-info { display: grid; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.delivery-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-muted); }
.delivery-row .material-icons-outlined { font-size: 20px; color: var(--brand-dark); }
.delivery-row strong { color: var(--text-primary); }
.section-divider { border: none; height: 1px; background: var(--border); margin: 48px auto; width: min(1200px, 94%); }

/* DESCRIPTION ... and other styles ... (kept the same) */
</style>
</head>
<body>

<!-- HEADER (Kept the same) -->
<header>
<div class="top-bar">
<div class="page-wrap top-bar-inner">
    <div class="brand">
        <a href="index.html" style="display: flex; align-items: center; gap: 12px;">

</div>
<nav class="nav-bar">
<div class="page-wrap">
    <div class="breadcrumb">
        <a href="index.html">Home</a><span class="breadcrumb-sep">/</span>
        <a href="category.html?type=greengrocer">GreenGrocer</a><span class="breadcrumb-sep">/</span>
        <a href="category.html?type=fruits-veg">Fresh Vegetable</a><span class="breadcrumb-sep">/</span>

<!-- MAIN CONTENT -->
<main class="product-page">

<section class="product-hero">

    <!-- LEFT: Image Gallery (Kept the same) -->

            <div class="slot-selection-wrap">

                    <option value="">-- Choose a collection time --</option>

</section>
</main>

<!-- JAVASCRIPT -->
<script>
// (Header scroll logic kept the same...)
window.addEventListener('scroll', () => { document.querySelector('header').classList.toggle('scrolled', window.scrollY > 50); });

// ✅ FIX: UPDATED BUY NOW FUNCTION
function buyNow() {
    const user_id = sessionStorage.getItem('user_id');
    const slot_id = document.getElementById('order-slot').value; // Get slot ID
    
    if (!user_id) {
        alert('Please login first to purchase!');
        window.location.href = 'login.html';
        return;
    }

    if (!slot_id) {
        alert('Please select a collection slot before proceeding!');
        document.getElementById('order-slot').focus();
        return;
    }

    const product_id = 3;
    const unit_price = 0.90;
    const qty = parseInt(document.getElementById('qtyVal').textContent) || 1;
    const buyBtn = document.getElementById('buyNowBtn');

    buyBtn.textContent = 'Processing...';
    buyBtn.disabled = true;

    // Call your PHP script
    fetch('../api/payment/create-order.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            user_id: user_id, 
            product_id: product_id, 
            quantity: qty, 
            unit_price: unit_price,
            slot_id: parseInt(slot_id) // ✅ NOW SENDING THE SLOT ID
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) { 
            window.location.href = '../api/payment/paypal.php'; 
        }
        else { 
            alert('Error: ' + (data.error || data.message || 'Could not create order')); 
            buyBtn.textContent = 'Buy now'; 
            buyBtn.disabled = false; 
        }
    })
    .catch((err) => { 
        console.error(err);
        alert('Connection error. Check console for details.'); 
        buyBtn.textContent = 'Buy now'; 
        buyBtn.disabled = false; 
    });
}
