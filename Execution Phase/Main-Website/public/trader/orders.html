<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuddersHub - Trader Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --primary-green: #0F260B;
            --primary-orange: #FF5E3A;
            --bg-light: #F7F6F3;
            --bg-white: #FFFFFF;
            --border-light: #DCE3DA;
            --text-black: #0B140A;
            --text-medium: #5E6A63;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); }
        .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--primary-green); color: white; height: 100vh; position: sticky; top: 0; }
        .sidebar-profile { padding: 28px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .sidebar-avatar { width: 64px; height: 64px; background: rgba(255,255,255,0.15); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; }
        .sidebar-name { font-weight: 700; }
        .sidebar-role { font-size: 12px; color: rgba(255,255,255,0.6); }
        .sidebar-nav-list { list-style: none; padding: 16px 12px; }
        .sidebar-nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.2s; background: none; border: none; cursor: pointer; width: 100%; text-align: left; font-size: inherit; font-family: inherit; }
        .sidebar-nav-item:hover, .sidebar-nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .main-content { padding: 28px; }
        .top-nav { background: white; border-bottom: 1px solid var(--border-light); padding: 0 28px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .order-table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--border-light); }
        .order-table th { background: var(--bg-light); padding: 12px 16px; text-align: left; font-weight: 600; font-size: 13px; color: var(--text-medium); }
        .order-table td { padding: 12px 16px; border-top: 1px solid var(--border-light); }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-active   { background: #D1FAE5; color: #065F46; }
        .status-pending  { background: #FEF3C7; color: #92400E; }
        .status-preparing { background: #DBEAFE; color: #1E40AF; }
        .status-ready    { background: #F3E8FF; color: #6D28D9; }
        .sidebar-toggle { display: none; }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: -280px; z-index: 200; }
            .sidebar.open { left: 0; }
            .sidebar-toggle { display: block; position: fixed; bottom: 20px; right: 20px; background: var(--primary-green); color: white; border: none; padding: 12px; border-radius: 50%; cursor: pointer; z-index: 300; }
        }
    </style>
</head>
<body>
<button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-profile">
            <div class="sidebar-avatar"><span class="material-icons-outlined">storefront</span></div>
            <div class="sidebar-name" id="sidebarName">Loading&hellip;</div>
            <div class="sidebar-role">Trader</div>
        </div>
        <nav class="sidebar-nav">
            <ul class="sidebar-nav-list">
                <li><a href="dashboard.html" class="sidebar-nav-item"><span class="material-icons-outlined">dashboard</span>Dashboard</a></li>
                <li><a href="products.html" class="sidebar-nav-item"><span class="material-icons-outlined">inventory_2</span>Products</a></li>
                <li><a href="orders.html" class="sidebar-nav-item active"><span class="material-icons-outlined">receipt_long</span>Orders</a></li>
                <li><a href="finance.html" class="sidebar-nav-item"><span class="material-icons-outlined">payments</span>Finance</a></li>
                <li><a href="profile.html" class="sidebar-nav-item"><span class="material-icons-outlined">manage_accounts</span>Profile</a></li>
                <li><button onclick="handleLogout()" class="sidebar-nav-item"><span class="material-icons-outlined">logout</span>Logout</button></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <header class="top-nav">
            <div>HuddersHub Trader</div>
            <div id="topNavName"></div>
        </header>
        <h1 style="margin-bottom: 20px;">Orders</h1>
        <div id="ordersContainer" style="overflow-x:auto; color:var(--text-medium);">Loading&hellip;</div>
    </main>
</div>
<script>
    const userId = sessionStorage.getItem('user_id');
    if (!userId || sessionStorage.getItem('userRole') !== 'trader') window.location.href = '../public/login.html';
    function handleLogout() { sessionStorage.clear(); window.location.href = '../public/login.html'; }
    document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

    function badge(status) {
        const map = { Completed: 'status-active', Pending: 'status-pending', Preparing: 'status-preparing', Ready: 'status-ready', Cancelled: 'status-pending' };
        return `<span class="status-badge ${map[status]||'status-pending'}">${status || 'Pending'}</span>`;
    }

    async function loadOrders() {
        try {
            const res = await fetch(`../api/trader/get-all-orders.php?user_id=${userId}`);
            const data = await res.json();
            const container = document.getElementById('ordersContainer');
            if (!data.success) { container.innerHTML = '<p>Failed to load orders.</p>'; return; }
            const orders = data.data || [];
            if (!orders.length) { container.innerHTML = '<p>No orders yet.</p>'; return; }
            container.innerHTML = `<table class="order-table">
                <thead><tr>
                    <th>#</th><th>Customer</th><th>Products</th><th>Slot</th><th>Status</th><th>Total</th>
                </tr></thead><tbody>
                ${orders.map(o => `<tr>
                    <td>#${o.order_id}</td>
                    <td>${o.customer_name || o.customer_id || '-'}</td>
                    <td>${o.product_count || 0} item(s)</td>
                    <td>${o.slot_date || ''} &middot; ${o.slot_time || ''}</td>
                    <td>${badge(o.status)}</td>
                    <td>&pound;${(o.total || 0).toFixed(2)}</td>
                </tr>`).join('')}
                </tbody></table>`;
        } catch { document.getElementById('ordersContainer').innerHTML = 'Error loading orders.'; }
    }
    loadOrders();
</script>
</body>
</html>
