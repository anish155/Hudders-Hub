<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuddersHub - Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,400;0,500;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F7F6F3;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;color:#0B140A}
.card{width:min(440px,100%);background:#fff;border:1px solid #DCE3DA;box-shadow:0 18px 36px rgba(15,38,11,.16);padding:32px}
h1{font-family:'Google Sans Flex',sans-serif;font-size:30px;margin-bottom:8px;color:#0F260B}
p{color:#5E6A63;line-height:1.6}
.field{margin-top:16px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.form-input{width:100%;height:46px;border:1px solid #DCE3DA;border-radius:0;padding:0 14px;background:#FAFBF8;font:inherit;font-size:15px;color:#0F260B;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:#FF5E3A;box-shadow:0 0 0 3px rgba(255,94,58,.18)}
.form-input.readonly{background:#EEF2EC;color:#5E6A63;cursor:not-allowed}
.password-wrap{position:relative}
.password-wrap .form-input{padding-right:14px}
.toggle-btn{position:absolute;right:0;top:0;width:44px;height:100%;margin:0;background:transparent;color:#5E6A63;border:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.toggle-btn .material-icons-outlined{font-size:22px;line-height:1}
button[type="submit"]{width:100%;height:46px;border:none;background:#FF5E3A;color:#fff;font-weight:700;margin-top:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;border-radius:0}
.message{margin-top:12px;font-size:14px;text-align:center}
.ok{color:#0F260B}.err{color:#B42318}
a{color:#FF5E3A;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>Reset password</h1>
  <p>Enter a new password for your account.</p>
  <form id="resetForm">
    <div class="field">
      <label>Email</label>
      <input id="email" class="form-input readonly" type="email" readonly aria-readonly="true">
    </div>
    <input id="token" type="hidden" required>
    <div class="field">
      <label>New password</label>
      <div class="password-wrap">
        <input class="form-input" id="newPassword" type="password" minlength="4" required>
        <button class="toggle-btn" id="toggleNewPassword" type="button" aria-label="Show or hide new password">
          <span class="material-icons-outlined" id="toggleNewPasswordIcon">visibility_off</span>
        </button>
      </div>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <div class="password-wrap">
        <input class="form-input" id="confirmPassword" type="password" minlength="4" required>
        <button class="toggle-btn" id="toggleConfirmPassword" type="button" aria-label="Show or hide confirm password">
          <span class="material-icons-outlined" id="toggleConfirmPasswordIcon">visibility_off</span>
        </button>
      </div>
    </div>
    <button id="submitBtn" type="submit">Update password</button>
  </form>
  <p id="message" class="message"></p>
  <p style="margin-top:14px;"><a href="login.html">Back to login</a></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('email').value = params.get('email') || '';
document.getElementById('token').value = params.get('token') || '';

function bindToggle(buttonId, inputId, iconId) {
  const button = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  button.addEventListener('click', function() {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.textContent = showing ? 'visibility_off' : 'visibility';
  });
}

bindToggle('toggleNewPassword', 'newPassword', 'toggleNewPasswordIcon');
bindToggle('toggleConfirmPassword', 'confirmPassword', 'toggleConfirmPasswordIcon');

document.getElementById('resetForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const token = document.getElementById('token').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('message');
  msg.textContent = '';
  msg.className = 'message';
  if (newPassword !== confirmPassword) {
    msg.textContent = 'Passwords do not match.';
    msg.classList.add('err');
    return;
  }
  fetch('../api/auth/reset-password.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, token, new_password: newPassword })
  })
  .then(r => r.json())
  .then(data => {
    msg.textContent = data.message || 'Done.';
    if (data.success) {
      msg.classList.add('ok');
      document.getElementById('resetForm').reset();
      setTimeout(() => window.location.href = 'login.html', 1200);
    } else {
      msg.classList.add('err');
    }
  })
  .catch(() => {
    msg.textContent = 'Server error.';
    msg.classList.add('err');
  });
});
</script>
</body>
</html>
